<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Chatify Database Design</text>

  <rect x="100" y="150" width="360" height="390" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="4"/>
  <rect x="100" y="150" width="360" height="70" rx="14" fill="#0891b2"/>
  <text x="280" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">User</text>
  <text x="135" y="270" font-family="Arial, sans-serif" font-size="24" fill="#334155">_id: ObjectId</text>
  <text x="135" y="315" font-family="Arial, sans-serif" font-size="24" fill="#334155">fullName: String</text>
  <text x="135" y="360" font-family="Arial, sans-serif" font-size="24" fill="#334155">email: String</text>
  <text x="135" y="405" font-family="Arial, sans-serif" font-size="24" fill="#334155">password: String</text>
  <text x="135" y="450" font-family="Arial, sans-serif" font-size="24" fill="#334155">profilePic: String</text>
  <text x="135" y="495" font-family="Arial, sans-serif" font-size="24" fill="#334155">createdAt / updatedAt</text>

  <rect x="740" y="150" width="360" height="430" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="4"/>
  <rect x="740" y="150" width="360" height="70" rx="14" fill="#0891b2"/>
  <text x="920" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Message</text>
  <text x="775" y="270" font-family="Arial, sans-serif" font-size="24" fill="#334155">_id: ObjectId</text>
  <text x="775" y="315" font-family="Arial, sans-serif" font-size="24" fill="#334155">senderId: ObjectId ref User</text>
  <text x="775" y="360" font-family="Arial, sans-serif" font-size="24" fill="#334155">receiverId: ObjectId ref User</text>
  <text x="775" y="405" font-family="Arial, sans-serif" font-size="24" fill="#334155">text: AES encrypted String</text>
  <text x="775" y="450" font-family="Arial, sans-serif" font-size="24" fill="#334155">image: String</text>
  <text x="775" y="495" font-family="Arial, sans-serif" font-size="24" fill="#334155">createdAt / updatedAt</text>

  <path d="M460 320 C560 260 640 260 740 320" fill="none" stroke="#0f172a" stroke-width="4"/>
  <path d="M460 400 C560 470 640 470 740 400" fill="none" stroke="#0f172a" stroke-width="4"/>
  <polygon points="730,312 752,320 730,328" fill="#0f172a"/>
  <polygon points="730,392 752,400 730,408" fill="#0f172a"/>
  <text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">senderId</text>
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">receiverId</text>

  <rect x="190" y="620" width="820" height="70" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="600" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#155e75">One user can send and receive many messages through senderId and receiverId references.</text>
